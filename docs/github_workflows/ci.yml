name: LitLens CI — Lint, Typecheck, Tests & Eval Harness

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with Ruff
        run: |
          ruff check app eval infra tests

      - name: Run Pytest suite (Unit + Integration + Moto AWS Mocks)
        env:
          ENVIRONMENT: test
        run: |
          pytest -v

      - name: Run 30-Question Golden Evaluation Benchmark Grid
        env:
          ENVIRONMENT: test
        run: |
          python -m eval.benchmark_grid
