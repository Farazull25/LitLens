name: Sync to Hugging Face Space (Free CPU Basic)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  push-to-space:
    runs-on: ubuntu-latest
    if: ${{ secrets.HF_TOKEN != '' && secrets.HF_SPACE_REPO != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Hugging Face Space git remote
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_REPO: ${{ secrets.HF_SPACE_REPO }}
        run: |
          git push --force https://USER:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE_REPO} main
