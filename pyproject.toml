[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "litlens"
version = "1.0.0"
description = "Production-grade Research Paper Copilot agent for arXiv using free-tier AWS & Hugging Face"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "LitLens Engineering" }]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "gradio>=4.36.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "langgraph>=0.1.0",
    "langchain-core>=0.2.0",
    "boto3>=1.34.0",
    "botocore>=1.34.0",
    "httpx>=0.27.0",
    "pymupdf>=1.24.0",
    "faiss-cpu>=1.8.0",
    "rank-bm25>=0.2.2",
    "numpy>=1.26.0",
    "sentence-transformers>=3.0.0",
    "huggingface-hub>=0.23.0",
    "structlog>=24.2.0",
    "tenacity>=8.3.0",
]

[project.optional-dependencies]
local-llm = [
    "llama-cpp-python>=0.2.77",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "moto[s3,dynamodb,ssm,ses,cloudwatch]>=5.0.0",
    "ruff>=0.4.8",
    "mypy>=1.10.0",
]

[tool.setuptools.packages.find]
include = ["app*", "eval*", "infra*"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app", "eval", "infra", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "C4", "SIM"]
ignore = ["S101", "B008", "E501", "SIM117"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]
"eval/**/*.py" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-q --tb=short"

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
